<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#000000" />

    <!-- Fonts: loaded here (not via CSS @import inside components) so the browser can fetch them early. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;900&amp;family=Playfair+Display:ital,wght@1,700&amp;family=Staatliches&amp;family=Stint+Ultra+Condensed&amp;display=swap"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&amp;display=swap"
    />

    <title>Rithin K Varghese | Web Developer | rk-studio</title>
    <meta
      name="description"
      content="Freelance web developer in Kerala, India. I build fast, mobile-friendly business websites, e-commerce stores and custom APIs through rk-studio."
    />
    <meta name="author" content="Rithin K Varghese" />

    <!-- Link previews (WhatsApp, LinkedIn, Slack, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rk-studio" />
    <meta property="og:title" content="Rithin K Varghese | Web Developer | rk-studio" />
    <meta
      property="og:description"
      content="Fast, mobile-friendly websites, e-commerce stores and custom APIs for small businesses. Based in Kerala, India."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rithin K Varghese | Web Developer | rk-studio" />
    <meta
      name="twitter:description"
      content="Fast, mobile-friendly websites, e-commerce stores and custom APIs for small businesses."
    />
    <!--
      AFTER YOU DEPLOY: uncomment these three lines and replace the address with your real site URL.
      Social sites need the full https:// address for the preview image; a relative path will not work.
      The image itself is already in /public/og-image.png.

      <meta property="og:url" content="https://YOUR-SITE-ADDRESS/" />
      <meta property="og:image" content="https://YOUR-SITE-ADDRESS/og-image.png" />
      <meta name="twitter:image" content="https://YOUR-SITE-ADDRESS/og-image.png" />
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
